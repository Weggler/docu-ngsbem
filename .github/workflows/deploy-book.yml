name: Build and deploy Jupyter Book

on:
  pull_request:
    branches: [main]
    paths:
      - "docu/**"
      - ".github/workflows/deploy-book.yml"

  push:
    branches: [main]
    paths:
      - "docu/**"
      - ".github/workflows/deploy-book.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docu/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docu/requirements.txt
          python -m pip install "ngsolve==6.2.2606"

      - name: Verify NGSolve
        run: |
          python - <<'PY'
          import ngsolve
          from netgen.geom2d import unit_square
          from ngsolve import H1, Mesh

          print("NGSolve:", ngsolve.__version__)
          print("NGSolve path:", ngsolve.__file__)

          mesh = Mesh(unit_square.GenerateMesh(maxh=0.3))
          fes = H1(mesh, order=2)

          assert mesh.ne > 0
          assert fes.ndof > 0
          print("NGSolve runtime test successful")
          PY

      - name: Build Jupyter Book
        run: |
          jupyter-book clean docu --all
          jupyter-book build docu --all

      - name: Verify generated site
        run: test -f docu/_build/html/index.html

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docu/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
