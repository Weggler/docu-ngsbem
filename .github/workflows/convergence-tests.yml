name: Convergence tests

on:
  pull_request:
    branches: [main]
    paths:
      - "convergence_timing/**"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/convergence-tests.yml"

  push:
    branches: [main]
    paths:
      - "convergence_timing/**"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/convergence-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install "ngsolve"

      - name: Run convergence tests
        run: python -m pytest tests --verbose
