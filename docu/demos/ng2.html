e, pointloop", calls: 3, size: 0.006152, value: 0.006152, min: 0.001803, max: 0.002291, avg: 0.002051} , { name: "Mesh::CalcSurfacesOfNode - surfelementht", calls: 3, size: 0.009973, value: 0.009973, min: 0.003183, max: 0.00351, avg: 0.003324} , { name: "Mesh::CalcSurfacesOfNode - surf on node", calls: 3, size: 0.03756, value: 0.03756, min: 0.01192, max: 0.0132, avg: 0.01252}]}]}]} , { name: "Mesh::CalcSurfacesOfNode", calls: 1, size: 0.01526, value: 0.04653, min: 0.04653, max: 0.04653, avg: 0.04653, children: [{ name: "Mesh::CalcSurfacesOfNode, pointloop", calls: 1, size: 0.002527, value: 0.002527, min: 0.002527, max: 0.002527, avg: 0.002527} , { name: "Mesh::CalcSurfacesOfNode - surfelementht", calls: 1, size: 0.004783, value: 0.004783, min: 0.004783, max: 0.004783, avg: 0.004783} , { name: "Mesh::CalcSurfacesOfNode - surf on node", calls: 1, size: 0.02397, value: 0.02397, min: 0.02397, max: 0.02397, avg: 0.02397}]}]};

const chart_type = 'time';

    const color = d3.scaleOrdinal(d3.schemePaired);

    let getTime = (t) =>
    {
       if(t>=1000)  return (t/1000).toPrecision(4) + '  s';
       if(t>=0.1)   return t.toPrecision(4) + ' ms';
       if(t>=1e-4)  return (t*1e3).toPrecision(4) + ' us';

       return (t/1e6).toPrecision(4) + ' ns';
    };

    const KB_ = 1024;
    const MB_ = KB_*1024;
    const GB_ = MB_*1024;
    let getMemory = (m) =>
    {
       if(m>=GB_)  return (m/GB_).toPrecision(4) + ' GB';
       if(m>=MB_)  return (m/MB_).toPrecision(4) + ' MB';
       if(m>=KB_)  return (m/KB_).toPrecision(4) + ' KB';
       return m.toPrecision(4) + ' B';
    };

    Sunburst()
      .data(data)
      .size('size')
      .color(d => color(d.name))
      .tooltipTitle((d, node) => { return node.parent ? node.parent.data.name + " &rarr; " + d.name : d.name; })
      .tooltipContent((d, node) => {
        if(chart_type=="memory")
        {
          return `Total Memory: <i>${getMemory(d.value)}</i> <br>`
               + `Memory: <i>${getMemory(d.size)}</i>`
        }
        else
        {
          return `Time: <i>${getTime(d.value)}</i> <br>`
               + `calls: <i>${d.calls}</i> <br>`
               + `min: <i>${getTime(d.min)}</i> <br>`
               + `max: <i>${getTime(d.max)}</i> <br>`
               + `avg: <i>${getTime(d.avg)}</i>`
        }
      })
      (document.getElementById('chart'));

      // Line breaks in tooltip
      var all = document.getElementsByClassName('sunbirst-tooltip');
      for (var i = 0; i < all.length; i++) {
          all[i].white_space = "";
      }
  </script>
